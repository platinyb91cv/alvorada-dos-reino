name: Soldados com armas Meshy - APK de teste
on:
  push:
    branches: [integracao-soldados-armas-meshy]
    paths:
      - 'www/**'
      - 'android/**'
      - 'package*.json'
      - 'tests/**'
      - '.github/workflows/soldados-armas-meshy-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar dependencias
        run: npm ci
      - name: Todos os testes CJS
        run: for file in tests/*.cjs; do node "$file"; done
      - name: Sincronizar assets
        run: npx cap sync android
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verificar conteudo do APK
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json,os
          root=pathlib.Path('.')
          apk=root/'android/app/build/outputs/apk/debug/app-debug.apk'
          paths=['index.html','assets/edificios-v2/bld-atlas-v2.webp','assets/edificios-v2/bld-v2.json']+[f'assets/units3d/{n}-armas-meshy.{e}' for n in ['guerreiro','lanceiro','espadachim','arqueiro','besteiro'] for e in ('webp','json')]
          report={'commit':os.environ['GITHUB_SHA'],'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'files':{}}
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name in paths:
                  data=z.read('assets/public/'+name)
                  assert data==(root/'www'/name).read_bytes(),name
                  report['files'][name]=hashlib.sha256(data).hexdigest()
          (root/'apk-verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alvorada-soldados-armas-meshy-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-verification.json
