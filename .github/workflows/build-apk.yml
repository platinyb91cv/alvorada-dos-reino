name: Gerar APK e AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ALV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # o pacote 'tools' deixou de existir nas cmdline-tools novas: instala só o necessário
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alvorada-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Link direto para o telemóvel: Releases → "APK de teste" → Alvorada-dos-Reinos.apk
      - name: Publicar APK na página Releases
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Alvorada-dos-Reinos.apk
          NOTAS="Versão de teste n.º ${{ github.run_number }} (commit ${GITHUB_SHA::7}). No telemóvel: toque em Alvorada-dos-Reinos.apk, abra o ficheiro e permita instalar de fontes desconhecidas."
          git tag -f apk-teste && git push -f origin apk-teste
          if gh release view apk-teste >/dev/null 2>&1; then
            gh release edit apk-teste --title "APK de teste (n.º ${{ github.run_number }})" --notes "$NOTAS" --latest
            gh release upload apk-teste Alvorada-dos-Reinos.apk --clobber
          else
            gh release create apk-teste Alvorada-dos-Reinos.apk --title "APK de teste (n.º ${{ github.run_number }})" --notes "$NOTAS" --latest
          fi

      # Versão para a Play Store: só corre se os segredos da chave de assinatura existirem
      - name: Preparar chave de assinatura
        id: chave
        env:
          KS_B64: ${{ secrets.ALV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ALV_KEYSTORE_PASS }}
          K_ALIAS: ${{ secrets.ALV_KEY_ALIAS }}
          K_PASS: ${{ secrets.ALV_KEY_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning title=Sem ficheiro AAB::Faltam os segredos ALV_KEYSTORE_B64, ALV_KEYSTORE_PASS, ALV_KEY_ALIAS e ALV_KEY_PASS (Settings > Secrets and variables > Actions). Sem eles só sai o APK de teste."
            exit 0
          fi
          KS="$RUNNER_TEMP/alvorada-upload.jks"
          # tira espaços e quebras de linha que vêm agarrados ao colar no telemóvel
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || { echo "::error title=ALV_KEYSTORE_B64 errado::O texto colado em ALV_KEYSTORE_B64 não é válido. Cole de novo TODO o conteúdo do ficheiro ALV_KEYSTORE_B64.txt."; exit 1; }
          limpa() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          PASS="$(limpa "$KS_PASS")"; KPASS="$(limpa "$K_PASS")"; ALIAS="$(limpa "$K_ALIAS")"
          if ! keytool -list -keystore "$KS" -storepass "$PASS" >/dev/null 2>&1; then
            echo "::error title=ALV_KEYSTORE_PASS errado::A palavra-passe em ALV_KEYSTORE_PASS não abre a chave (ou ALV_KEYSTORE_B64 está incompleto). Copie de novo a palavra-passe do SEGREDOS-GITHUB.txt, sem espaços."
            exit 1
          fi
          # alias: o que está mesmo dentro da chave (evita erros de maiúsculas/espaços em ALV_KEY_ALIAS)
          ALIAS="$(keytool -list -keystore "$KS" -storepass "$PASS" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')"
          # chave PKCS12 (a nossa): a palavra-passe da chave é sempre igual à do ficheiro
          if keytool -list -keystore "$KS" -storepass "$PASS" 2>/dev/null | grep -qi 'type: PKCS12'; then
            KPASS="$PASS"
          else
            [ -z "$KPASS" ] && KPASS="$PASS"
            keytool -certreq -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" -keypass "$KPASS" >/dev/null 2>&1 || {
              echo "::warning::ALV_KEY_PASS não abre a chave; a usar a palavra-passe de ALV_KEYSTORE_PASS."; KPASS="$PASS"; }
          fi
          echo "::add-mask::$PASS"; echo "::add-mask::$KPASS"
          {
            echo "ALV_KEYSTORE=$KS"
            echo "ALV_KEYSTORE_PASS=$PASS"
            echo "ALV_KEY_ALIAS=$ALIAS"
            echo "ALV_KEY_PASS=$KPASS"
          } >> "$GITHUB_ENV"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Compilar AAB e APK assinados (Play Store)
        if: steps.chave.outputs.ok == '1'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == '1'
        with:
          name: alvorada-play-store
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      # AAB (para a Play Store) e APK assinado também na página Releases, ao lado do APK de teste
      - name: Publicar AAB na página Releases
        if: steps.chave.outputs.ok == '1' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Alvorada-dos-Reinos-PlayStore.aab
          cp android/app/build/outputs/apk/release/app-release.apk Alvorada-dos-Reinos-assinado.apk
          gh release upload apk-teste Alvorada-dos-Reinos-PlayStore.aab Alvorada-dos-Reinos-assinado.apk --clobber
          gh release edit apk-teste --title "APK e AAB (versão ${{ github.run_number }})" --notes "Versão n.º ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Alvorada-dos-Reinos-PlayStore.aab → enviar na Play Console. Alvorada-dos-Reinos.apk → instalar no telemóvel para testar."

      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/alvorada-upload.jks"
