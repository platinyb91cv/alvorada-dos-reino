name: Gerar APK e AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ALV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # o pacote 'tools' deixou de existir nas cmdline-tools novas: instala só o necessário
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alvorada-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Link direto para o telemóvel: Releases → "APK de teste" → Alvorada-dos-Reinos.apk
      - name: Publicar APK na página Releases
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Alvorada-dos-Reinos.apk
          NOTAS="Versão de teste n.º ${{ github.run_number }} (commit ${GITHUB_SHA::7}). No telemóvel: toque em Alvorada-dos-Reinos.apk, abra o ficheiro e permita instalar de fontes desconhecidas."
          git tag -f apk-teste && git push -f origin apk-teste
          if gh release view apk-teste >/dev/null 2>&1; then
            gh release edit apk-teste --title "APK de teste (n.º ${{ github.run_number }})" --notes "$NOTAS" --latest
            gh release upload apk-teste Alvorada-dos-Reinos.apk --clobber
          else
            gh release create apk-teste Alvorada-dos-Reinos.apk --title "APK de teste (n.º ${{ github.run_number }})" --notes "$NOTAS" --latest
          fi

      # Versão para a Play Store: só corre se os segredos da chave de assinatura existirem
      - name: Preparar chave de assinatura
        id: chave
        env:
          KS_B64: ${{ secrets.ALV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alvorada-upload.jks"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "Sem chave de assinatura (segredo ALV_KEYSTORE_B64): salta a versão da Play Store."
          fi

      - name: Compilar AAB e APK assinados (Play Store)
        if: steps.chave.outputs.ok == '1'
        working-directory: android
        env:
          ALV_KEYSTORE: ${{ runner.temp }}/alvorada-upload.jks
          ALV_KEYSTORE_PASS: ${{ secrets.ALV_KEYSTORE_PASS }}
          ALV_KEY_ALIAS: ${{ secrets.ALV_KEY_ALIAS }}
          ALV_KEY_PASS: ${{ secrets.ALV_KEY_PASS }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == '1'
        with:
          name: alvorada-play-store
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/alvorada-upload.jks"
