name: Gerar vozes do conselheiro

# Gera as falas do conselheiro (voz neural em português de Portugal, Piper "tugão", licença livre)
# a partir de arte/vozes/falas.txt e publica-as em MP3 na Release "vozes".
on:
  workflow_dispatch:
  push:
    paths: ['arte/vozes/falas.txt', '.github/workflows/vozes.yml']

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Instalar Piper e a voz
        run: |
          pip install piper-tts==1.2.0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_PT/tug%C3%A3o/medium
          curl -sSfL -o voz.onnx "$B/pt_PT-tug%C3%A3o-medium.onnx"
          curl -sSfL -o voz.onnx.json "$B/pt_PT-tug%C3%A3o-medium.onnx.json"
      - name: Gerar falas
        run: |
          mkdir -p out
          grep -v '^#' arte/vozes/falas.txt | while IFS='|' read -r id txt; do
            [ -z "$id" ] && continue
            echo "$txt" | piper --model voz.onnx --length_scale 1.08 --output_file "out/$id.wav"
            # voz mais grave e com um pouco de sala (salão do castelo)
            ffmpeg -nostdin -loglevel error -y -i "out/$id.wav" -af "asetrate=22050*0.94,aresample=22050,atempo=1.04,aecho=0.8:0.6:40:0.18,highpass=f=90,loudnorm=I=-16:TP=-1.5" -ac 1 -ar 22050 -c:a libmp3lame -b:a 40k "out/$id.mp3"
          done
          ls -la out/*.mp3
          cd out && zip -q ../vozes.zip *.mp3
      - name: Publicar
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view vozes >/dev/null 2>&1 || gh release create vozes --title "Vozes do conselheiro" --notes "Falas geradas com Piper (pt_PT tugão)."
          gh release upload vozes vozes.zip --clobber
