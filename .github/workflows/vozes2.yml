name: Gerar vozes do conselheiro (v2, estilo jogo)

# Vozes novas do conselheiro, sem API: Chatterbox Multilingual (licença MIT, corre no próprio GitHub).
# O timbre vem de uma frase de referência em português de Portugal (Piper "tugão");
# o Chatterbox dá a entoação teatral de jogo. Depois: grave, quente e com eco de salão.
# Gera duas versões (A: calma e firme, B: mais dramática) e publica na Release "vozes".
on:
  workflow_dispatch:
  push:
    paths: ['arte/vozes/falas.txt', '.github/workflows/vozes2.yml']

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts piper-tts==1.2.0
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_PT/tug%C3%A3o/medium
          curl -sSfL -o voz.onnx "$B/pt_PT-tug%C3%A3o-medium.onnx"
          curl -sSfL -o voz.onnx.json "$B/pt_PT-tug%C3%A3o-medium.onnx.json"
      - name: Voz de referência (timbre)
        run: |
          echo "Meu senhor, o reino está em paz. Os campos dão trigo, as minas dão ouro, e o povo confia no seu Rei. Mas devemos estar sempre preparados." \
            | piper --model voz.onnx --length_scale 1.1 --output_file ref_raw.wav
          ffmpeg -nostdin -loglevel error -y -i ref_raw.wav -af "asetrate=22050*0.95,aresample=24000,atempo=1.05" -ac 1 ref.wav
      - name: Gerar falas
        run: |
          cat > gerar.py <<'PY'
          import torchaudio as ta, torch, os
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          torch.manual_seed(7)
          m = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          V = {'A': dict(exaggeration=0.55, cfg_weight=0.45, temperature=0.7),
               'B': dict(exaggeration=0.85, cfg_weight=0.35, temperature=0.75)}
          for v in V: os.makedirs(f'out/{v}', exist_ok=True)
          for line in open('arte/vozes/falas.txt', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'): continue
              i, txt = line.split('|', 1)
              for v, kw in V.items():
                  torch.manual_seed(7)
                  w = m.generate(txt, language_id='pt', audio_prompt_path='ref.wav', **kw)
                  ta.save(f'out/{v}/{i}.wav', w, m.sr)
                  print(v, i, round(w.shape[-1] / m.sr, 2), 's', flush=True)
          PY
          python gerar.py
      - name: Som de jogo e MP3
        run: |
          for f in out/*/*.wav; do
            o="${f%.wav}.mp3"
            # corta silêncios, grave e quente, presença na voz, eco curto de salão, volume uniforme
            ffmpeg -nostdin -loglevel error -y -i "$f" -af "silenceremove=start_periods=1:start_threshold=-45dB:stop_periods=1:stop_duration=0.25:stop_threshold=-45dB,asetrate=24000*0.97,aresample=24000,atempo=1.03,highpass=f=85,equalizer=f=180:t=q:w=1:g=3,equalizer=f=3200:t=q:w=1.2:g=2.5,lowpass=f=9000,aecho=0.8:0.55:45|70:0.16|0.09,acompressor=threshold=-18dB:ratio=3:attack=5:release=120,loudnorm=I=-16:TP=-1.5" -ac 1 -ar 24000 -c:a libmp3lame -b:a 48k "$o"
          done
          ls -la out/A out/B
          (cd out/A && zip -q ../../vozes_v2_A.zip *.mp3) && (cd out/B && zip -q ../../vozes_v2_B.zip *.mp3)
      - name: Publicar
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view vozes >/dev/null 2>&1 || gh release create vozes --title "Vozes do conselheiro" --notes "Falas do conselheiro."
          gh release upload vozes vozes_v2_A.zip vozes_v2_B.zip --clobber
