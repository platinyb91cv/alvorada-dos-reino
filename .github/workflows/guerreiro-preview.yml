name: APK de revisao do guerreiro

on:
  pull_request:
    paths:
      - 'www/index.html'
      - 'arte/rei/**'
      - 'tests/check_king_atlas.cjs'
      - '.github/workflows/guerreiro-preview.yml'
  push:
    branches: ['codex/guerreiro-meshy-animado']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar o atlas integrado
        run: node tests/check_king_atlas.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar somente APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: alvorada-guerreiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
